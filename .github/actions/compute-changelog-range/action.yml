name: "Compute Changelog Range"
description: |
  Computes the 'from' and 'to' Git references for generating a changelog.

inputs:
  project_name:
    description: "The project name to prefix branches and tags with, if using a multi-project setup"
    required: false
    default: ""

  bootstrap_ref:
    description: "For legacy projects, a commit SHA or tag to use as the starting point for the first release"
    required: false
    default: ""

outputs:
  from:
    description: "The starting Git ref for the changelog"
    value: "${{ steps.set_outputs.outputs.from }}"

  to:
    description: "The ending Git ref for the changelog"
    value: "${{ steps.set_outputs.outputs.to }}"

runs:
  using: "composite"

  steps:
    - name: "Set Git Safe Directory"
      shell: "bash"
      run: |
        # step: Set Git Safe Directory

        git config --global --add safe.directory "${GITHUB_WORKSPACE}"

    - name: "Determine Current Branch Name and Source"
      id: "determine_current_branch_name_and_source"
      shell: "bash"
      run: |
        # step: Determine Current Branch Name and Source

        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
             # Pull requests use the base (target) branch of the PR
            __branch="${GITHUB_BASE_REF}"
        elif [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
             # Merge group (e.g., GitHub merge queue) uses GITHUB_REF
            __branch="$(echo "${GITHUB_REF}" | awk -F'/' '{ if (NF > 5) { print $4"/"$5 } else { print $4 } }')"
        elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            __version="${GITHUB_REF_NAME#v}"
            __version="${__version%%-*}"
            __version_patch="${__version##*.}"

            if [[ "${__version_patch}" == "0" ]]; then
                __branch="release/v${__version}"
            else
                __branch="hotfix/v${__version}"
            fi
        else
            __branch="${GITHUB_REF_NAME}"
        fi

        # Fallback Method: If CI variables were inconclusive, inspect Git history directly.
        if [[ -z "${__branch}" ]]; then
            git fetch --all --quiet

            # In detached HEAD state, find all branches containing the current commit
            __branches="$(git branch --contains HEAD --format='%(refname:short)' | grep -v 'HEAD detached' || :)"

            # Prioritize specific branches if multiple candidates exist
            __branch="$(
                echo "${__branches}" | grep -E '^release/' ||
                echo "${__branches}" | grep -E '^hotfix/' ||
                echo "${__branches}" | grep -E '^develop$'
            )"
        fi

        __branch="${__branch:-unknown}"

        {
            echo "branch=${__branch}"
        } >>"${GITHUB_OUTPUT}"

    - name: "Build SemVer Options"
      id: "build_semver_options"
      shell: "bash"
      run: |
        # step: Build SemVer Options

        __options="--branch ${{ steps.determine_current_branch_name_and_source.outputs.branch }}"

        if [[ -n "${{ inputs.project_name }}" ]]; then
          __options+=",--project-name ${{ inputs.project_name }}"
        fi

        if [[ -n "${{ inputs.bootstrap_ref }}" ]]; then
          __options+=",--bootstrap-ref ${{ inputs.bootstrap_ref }}"
        fi

        # Always request JSON output for parsing
        __options+=",--json"

        {
            echo "options=${__options}"
        } >>"${GITHUB_OUTPUT}"

    - name: "Download SemVer Script"
      shell: "bash"
      run: |
        # step: Download SemVer Script

        curl -sSL -o "${{ runner.temp }}/semver.sh" "https://raw.githubusercontent.com/srheaume/semver/refs/tags/v0.1.0-stable/semver.sh"
        chmod +x "${{ runner.temp }}/semver.sh"

    - name: "Execute SemVer Command"
      id: "execute_semver_command"
      shell: "bash"
      run: |
        # step: Execute SemVer Command

        # Construct the SemVer command to execute
        __semver_cmd="${{ runner.temp }}/semver.sh show-version"

        # Convert the comma-separated options into a space-separated list and append them to the command
        __options="$(echo "${{ steps.build_semver_options.outputs.options }}" | tr ',\r\n' ' ')"

        for __option in ${__options}; do
            __semver_cmd+=" ${__option}"
        done

        # Execute the SemVer command and capture the JSON output
        __output="$(${__semver_cmd})"

        {
            echo 'output<<EOF'
            echo "${__output}"
            echo 'EOF'
        } >>"${GITHUB_OUTPUT}"

    - name: "Set Outputs"
      id: "set_outputs"
      shell: "bash"
      run: |
        # step: Set Outputs

        __json_output='${{ steps.execute_semver_command.outputs.output }}'

        {
            echo "from=$(echo "${__json_output}" | jq -r '.from')"
            echo "to=$(echo "${__json_output}" | jq -r '.to')"
        } >>"${GITHUB_OUTPUT}"
