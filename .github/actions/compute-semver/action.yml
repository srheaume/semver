name: "Compute SemVer"
description: |
  Computes the semantic version based on Git history, pull requests, and breaking changes.

inputs:
  project_name:
    description: "The project name to prefix branches and tags with, if using a multi-project setup"
    required: false
    default: ""

  base_version:
    description: "The base version to use if no tags are found in the repository (e.g., '0.1.0')"
    required: false
    default: "0.1.0"

  skip_breaking_changes_from:
    description: "List of authors whose breaking changes should be ignored, comma or line-separated"
    required: false
    default: ""

outputs:
  semver:
    description: "Full computed semantic version"
    value: "${{ steps.set_version_outputs.outputs.semver }}"

  major:
    description: "Major version component"
    value: "${{ steps.set_version_outputs.outputs.major }}"

  minor:
    description: "Minor version component"
    value: "${{ steps.set_version_outputs.outputs.minor }}"

  patch:
    description: "Patch version component"
    value: "${{ steps.set_version_outputs.outputs.patch }}"

  pre_release:
    description: "Pre-release identifier"
    value: "${{ steps.set_version_outputs.outputs.pre_release }}"

  increment:
    description: "Increment value for the pre-release identifier"
    value: "${{ steps.set_version_outputs.outputs.increment }}"

runs:
  using: "composite"

  steps:
    - name: "Set Git Safe Directory"
      shell: "bash"
      run: |
        # step: Set Git Safe Directory

        git config --global --add safe.directory "${GITHUB_WORKSPACE}"

    - name: "Determine Current Branch Name and Source"
      id: "determine_current_branch_name_and_source"
      shell: "bash"
      run: |
        # step: Determine Current Branch Name and Source

        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
             # Pull requests use the base (target) branch of the PR
            __branch="${GITHUB_BASE_REF}"
            __branch_source="pr"
        elif [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
             # Merge group (e.g., GitHub merge queue) uses GITHUB_REF
            __branch="$(echo "${GITHUB_REF}" | awk -F'/' '{ if (NF > 5) { print $4"/"$5 } else { print $4 } }')"
            __branch_source="merge_group"
        elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            __version="${GITHUB_REF_NAME#v}"
            __version="${__version%%-*}"
            __version_patch="${__version##*.}"

            if [[ "${__version_patch}" == "0" ]]; then
                __branch="release/v${__version}"
            else
                __branch="hotfix/v${__version}"
            fi
            __branch_source="tag"
        else
            __branch="${GITHUB_REF_NAME}"
            __branch_source="normal"
        fi

        # Fallback Method: If CI variables were inconclusive, inspect Git history directly.
        if [[ -z "${__branch}" ]]; then
            git fetch --all --quiet

            # In detached HEAD state, find all branches containing the current commit
            __branches="$(git branch --contains HEAD --format='%(refname:short)' | grep -v 'HEAD detached' || :)"

            # Prioritize specific branches if multiple candidates exist
            __branch="$(
                echo "${__branches}" | grep -E '^release/' ||
                echo "${__branches}" | grep -E '^hotfix/' ||
                echo "${__branches}" | grep -E '^develop$'
            )"
        fi

        __branch="${__branch:-unknown}"

        {
            echo "branch=${__branch}"
            echo "branch_source=${__branch_source}"
        } >>"${GITHUB_OUTPUT}"

    - name: "Build SemVer Options"
      id: "build_semver_options"
      shell: "bash"
      run: |
        # step: Build SemVer Options

        __options="--branch ${{ steps.determine_current_branch_name_and_source.outputs.branch }}"

        if [[ -n "${{ inputs.project_name }}" ]]; then
          __options+=",--project-name ${{ inputs.project_name }}"
        fi

        if [[ -n "${{ inputs.base_version }}" ]]; then
          __options+=",--base-version ${{ inputs.base_version }}"
        fi

        # If the trigger is a pull request, switch to the 'request-number' versioning strategy
        if [[ "${{ steps.determine_current_branch_name_and_source.outputs.branch_source }}" == "pr" ]]; then
            __options+=",--versioning-strategy request-number"
            __options+=",--request-number ${{ github.event.number }}"
            __options+=",--request-type pr"
        fi

        # Add options to skip breaking changes from specified authors, if provided
        if [[ -n "${{ inputs.skip_breaking_changes_from }}" ]]; then
            __authors="$(echo "${{ inputs.skip_breaking_changes_from }}" | tr ',\r\n' ' ')"
            for __author in ${__authors}; do
                __options+=",--skip-breaking-changes-from ${__author}"
            done
        fi

        # Always request JSON output for parsing
        __options+=",--json"

        {
            echo "options=${__options}"
        } >>"${GITHUB_OUTPUT}"

    - name: "Download SemVer Script"
      shell: "bash"
      run: |
        # step: Download SemVer Script

        curl -sSL -o "${{ runner.temp }}/semver.sh" "https://raw.githubusercontent.com/srheaume/semver/refs/tags/v0.1.0-stable/semver.sh"
        chmod +x "${{ runner.temp }}/semver.sh"

    - name: "Execute SemVer Command"
      id: "execute_semver_command"
      shell: "bash"
      run: |
        # step: Execute SemVer Command

        # Construct the SemVer command to execute
        __semver_cmd="${{ runner.temp }}/semver.sh show-version"

        # Convert the comma-separated options into a space-separated list and append them to the command
        __options="$(echo "${{ steps.build_semver_options.outputs.options }}" | tr ',\r\n' ' ')"

        for __option in ${__options}; do
            __semver_cmd+=" ${__option}"
        done

        # Execute the SemVer command and capture the JSON output
        __output="$(${__semver_cmd})"

        {
            echo 'output<<EOF'
            echo "${__output}"
            echo 'EOF'
        } >>"${GITHUB_OUTPUT}"

    - name: "Set Version Outputs"
      id: "set_version_outputs"
      shell: "bash"
      run: |
        # step: Set Version Outputs

        __json_output='${{ steps.execute_semver_command.outputs.output }}'

        {
            echo "semver=$(echo "${__json_output}" | jq -r '.semver')"
            echo "major=$(echo "${__json_output}" | jq -r '.components.major')"
            echo "minor=$(echo "${__json_output}" | jq -r '.components.minor')"
            echo "patch=$(echo "${__json_output}" | jq -r '.components.patch')"
            echo "pre_release=$(echo "${__json_output}" | jq -r '.components.pre_release')"
            echo "release_type=$(echo "${__json_output}" | jq -r '.components.release_type')"        
            echo "increment=$(echo "${__json_output}" | jq -r '.components.increment')"
        } >>"${GITHUB_OUTPUT}"
